<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>吕金泽 · 拓竹校园大使</title>
  <style>
    /* ----- 重置 & 设计变量 (移动优先) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      color-scheme: light dark;
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --secondary: #0ea5e9;
      --bg-light: #ffffff;
      --bg-dark: #0f172a;
      --surface-light: #f8fafc;
      --surface-dark: #1e293b;
      --text-light: #0b1120;
      --text-dark: #f1f5f9;
      --border-light: #e2e8f0;
      --border-dark: #334155;
      --card-shadow: 0 12px 24px -12px rgba(0,0,0,0.08);
      --transition: 0.18s ease-out;
      --radius-lg: 24px;
      --radius-sm: 40px;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      line-height: 1.5;
      transition: background-color 0.25s, color 0.25s;
      scroll-behavior: smooth;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    body.dark .badge,
    body.dark .skill-tag {
      background: #263445;
      color: #b9cef0;
    }

    /* ----- 导航栏 (固定) ----- */
    .nav-bar {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
      z-index: 99;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    body.dark .nav-bar {
      background: rgba(20,28,45,0.8);
      border-bottom-color: var(--border-dark);
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.4rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: inherit;
      opacity: 0.75;
      font-size: 0.9rem;
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
    }

    .nav-links a:hover {
      opacity: 1;
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-sm);
      color: inherit;
    }

    .music-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 0.2rem 0.8rem;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .container {
      max-width: 1200px;
      margin: 1rem auto 2rem;
      padding: 0 1.2rem;
    }

    /* ----- Hero 区 (含真实图片引用) ----- */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin: 2rem 0 2.5rem;
      gap: 1.8rem;
    }

    .hero-text h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(145deg, var(--primary), #9333ea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
    }

    .hero-tagline {
      font-size: 1.2rem;
      opacity: 0.85;
      margin: 0.5rem 0 1rem;
    }

    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 1rem 0;
    }

    .badge {
      background: #e6edfc;
      padding: 0.3rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 530;
      color: var(--primary);
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      align-items: center;
    }

    .contact-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 530;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 8px 16px -8px #2563eb80;
      cursor: pointer;
    }

    .hero-images {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .hero-images img {
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      box-shadow: var(--card-shadow);
      background: #cbd5e1;
    }

    .photo-img {
      width: 110px;
      height: 110px;
    }

    .teenage-img {
      width: 140px;
      height: 100px;
      border-radius: 28px;
      object-fit: cover;
    }

    /* 亮点卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin: 2.5rem 0;
    }

    .stat-card {
      background: var(--surface-light);
      border-radius: var(--radius-lg);
      padding: 1.5rem 0.5rem;
      text-align: center;
      border: 1px solid var(--border-light);
      box-shadow: var(--card-shadow);
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-light);
      margin: 2rem 0 1.2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 40px 40px 0 0;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      opacity: 1;
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-pane {
      display: none;
      background: var(--surface-light);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--card-shadow);
    }

    .tab-pane.active {
      display: block;
    }

    /* 经历条目 */
    .exp-item {
      margin-bottom: 2rem;
    }

    .exp-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.3rem;
      margin-bottom: 0.4rem;
    }

    .exp-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .exp-sub {
      color: var(--primary);
      font-weight: 530;
    }

    .exp-date {
      font-size: 0.8rem;
      opacity: 0.6;
    }

    .exp-desc {
      padding-left: 1.2rem;
      margin-top: 0.4rem;
    }

    .exp-desc li {
      margin-bottom: 0.5rem;
      font-size: 0.93rem;
    }

    /* 项目卡片 */
    .project-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .project-card {
      background: var(--bg-light);
      border-radius: 22px;
      padding: 1.2rem;
      border: 1px solid var(--border-light);
    }

    body.dark .project-card {
      background: #1f2a3c;
    }

    .project-name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.5rem 0;
    }

    .tech-tag {
      background: var(--primary);
      color: white;
      font-size: 0.7rem;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
    }
    .project-actions {
      margin-top: 0.8rem;
    }
    .proj-btn {
      display: inline-block;
      text-decoration: none;
      border: 1px solid var(--border-light);
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: inherit;
      transition: color var(--transition), border-color var(--transition);
    }
    .proj-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    /* 技能矩阵 */
    .skill-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    .skill-cat h4 {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      opacity: 0.9;
    }

    .skill-tag {
      display: inline-block;
      background: #dbeafe;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      margin: 0.2rem 0.2rem;
      color: #1e3a8a;
    }

    /* 教育 */
    .edu-card {
      display: flex;
      gap: 0.8rem;
      border-left: 4px solid var(--primary);
      padding-left: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .award-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .award-list li {
      background: var(--surface-light);
      border-radius: 40px;
      padding: 0.3rem 1.2rem;
      border: 1px solid var(--border-light);
    }

    footer {
      margin-top: 4rem;
      padding: 2rem 0;
      text-align: center;
      border-top: 1px solid var(--border-light);
      font-size: 0.85rem;
    }

    .back-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.2rem;
      background: var(--primary);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px #2563eb70;
      border: none;
      cursor: pointer;
      z-index: 99;
    }

    /* 打印样式 */
    @media print {
      .nav-bar, .back-to-top, .icon-btn, .music-btn, .tabs-nav {
        display: none !important;
      }
      body { background: white; color: black; }
      .tab-pane { display: block !important; }
    }

    @media (max-width: 480px) {
      .hero-text h1 { font-size: 2.2rem; }
      .hero-images { justify-content: center; }
    }
  </style>
</head>

        education: [
          { school:'同济大学 国豪书院', major:'未来技术专业', date:'2025.09至今', note:'高考统招拔尖特区，参与红色实践、社群建设' },
          { school:'金川高级中学', major:'理科', date:'2022.09-2025.06', note:'班级组织委员、文学社副社长、合唱团团长；多次优胜奖，年级前10%' }
        ],
        awards: [
          '2025 图书馆“优秀志愿者”','2024 托管班“优秀辅导教师”','2023 运动会1500米三等奖',
          '2022-2024 多次“学习优胜奖”','2019 围棋少年棋王赛个人亚军'
        ]
      };

      // 渲染 Hero 徽章
      const heroBadges = document.getElementById('heroBadges');
      resume.heroBadges.forEach(b => {
        const span = document.createElement('span');
        span.className = 'badge';
        span.textContent = b;
        heroBadges.appendChild(span);
      });

      // 亮点统计
      const statsGrid = document.getElementById('highlights');
      resume.highlights.forEach(h => {
        const card = document.createElement('div');
        card.className = 'stat-card';
        card.innerHTML = `<div class="stat-number">${h.num}</div><div class="stat-label">${h.label}</div>`;
        statsGrid.appendChild(card);
      });

      // 渲染经历 tab
      function renderExpTab(containerId, list) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        list.forEach(ex => {
          const liDesc = ex.desc.map(d => `<li>${d}</li>`).join('');
          container.innerHTML += `
            <div class="exp-item">
              <div class="exp-header">
                <span class="exp-title">${ex.title}</span>
                <span class="exp-sub">${ex.org}</span>
                <span class="exp-date">${ex.date}</span>
              </div>
              <ul class="exp-desc">${liDesc}</ul>
            </div>
          `;
        });
      }
      renderExpTab('tabCampus', resume.expCampus);
      renderExpTab('tabTeach', resume.expTeach);
      renderExpTab('tabVolunteer', resume.expVolunteer);

      // 渲染项目 tabs
      function renderProjPane(paneId, list) {
        const pane = document.getElementById(paneId);
        pane.innerHTML = '<div class="project-grid"></div>';
        const grid = pane.querySelector('.project-grid');
        list.forEach(p => {
          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <div class="project-name">${p.name}</div>
            <div class="project-tech"><span class="tech-tag">${p.tech}</span></div>
            <div style="opacity:0.8;">${p.result || ''}</div>
            ${p.href ? `<div class="project-actions"><a class="proj-btn" href="${p.href}" target="_blank" rel="noopener">访问演示</a></div>` : ''}
          `;
          grid.appendChild(card);
        });
      }
      renderProjPane('projAwardPane', resume.projAwards);
      renderProjPane('projProjectPane', resume.projProjects);
      renderProjPane('projWorksPane', resume.projWorks);

      // 技能矩阵
      const skillMatrix = document.getElementById('skillMatrix');
      resume.skills.forEach(s => {
        const tags = s.items.map(i => `<span class="skill-tag">${i}</span>`).join('');
        skillMatrix.innerHTML += `<div class="skill-cat"><h4>${s.cat}</h4>${tags}</div>`;
      });

      // 教育
      const eduDiv = document.getElementById('eduContainer');
      resume.education.forEach(e => {
        eduDiv.innerHTML += `<div class="edu-card"><div><strong>${e.school}</strong> · ${e.major}<br><small>${e.date}</small><p>${e.note}</p></div></div>`;
      });
      const awardsDiv = document.getElementById('awardsContainer');
      awardsDiv.innerHTML = '<ul class="award-list">' + resume.awards.map(a => `<li>${a}</li>`).join('') + '</ul>';

      // 交互功能
      const themeBtn = document.getElementById('themeToggle');
      themeBtn.addEventListener('click', () => document.body.classList.toggle('dark'));

      document.getElementById('printBtn').addEventListener('click', () => window.print());

      document.getElementById('copyEmailBtn').addEventListener('click', () => {
        const email = '2552399' + '@' + 'tongji.edu.cn';
        navigator.clipboard.writeText(email).then(() => alert('邮箱已复制：' + email));
      });

      document.querySelectorAll('[data-smooth]').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const target = document.querySelector(link.getAttribute('href'));
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        });
      });

      document.getElementById('backToTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      // 经历 tabs
      const tabCampusBtn = document.getElementById('tabCampusBtn');
      const tabTeachBtn = document.getElementById('tabTeachBtn');
      const tabVolBtn = document.getElementById('tabVolunteerBtn');
      const panes = [document.getElementById('tabCampus'), document.getElementById('tabTeach'), document.getElementById('tabVolunteer')];
      const expBtns = [tabCampusBtn, tabTeachBtn, tabVolBtn];
      expBtns.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          expBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          panes.forEach(p => p.classList.remove('active'));
          panes[idx].classList.add('active');
        });
      });

      // 项目 tabs
      const projBtns = [document.getElementById('projAwardBtn'), document.getElementById('projProjectBtn'), document.getElementById('projWorksBtn')];
      const projPanes = [document.getElementById('projAwardPane'), document.getElementById('projProjectPane'), document.getElementById('projWorksPane')];
      projBtns.forEach((btn, idx) => {
        btn.addEventListener('click', () => {
          projBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          projPanes.forEach(p => p.classList.remove('active'));
          projPanes[idx].classList.add('active');
        });
      });

      // 键盘左右切换经历 tab
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          const activeTab = document.querySelector('#expTabsNav .tab-btn.active');
          if (!activeTab) return;
          const idx = expBtns.indexOf(activeTab);
          if (e.key === 'ArrowLeft' && idx > 0) expBtns[idx-1].click();
          if (e.key === 'ArrowRight' && idx < expBtns.length-1) expBtns[idx+1].click();
        }
      });

      // 背景音乐控制
      const music = document.getElementById('bgMusic');
      const musicBtn = document.getElementById('musicToggle');
      let isPlaying = false;

      musicBtn.addEventListener('click', () => {
        if (isPlaying) {
          music.pause();
          musicBtn.innerHTML = '🎵 播放音乐';
        } else {
          music.play().catch(e => {
            alert('无法自动播放，请手动点击播放。如果文件不存在，请检查 music.mp3 路径。');
          });
          musicBtn.innerHTML = '⏸️ 暂停音乐';
        }
        isPlaying = !isPlaying;
      });

      // 音乐结束时重置按钮
      music.addEventListener('ended', () => {
        isPlaying = false;
        musicBtn.innerHTML = '🎵 播放音乐';
      });
    })();
  </script>
</body>
</html>
